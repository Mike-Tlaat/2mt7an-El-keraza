<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>التحكم في الامتحانات</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      .adm-wrap {
        max-width: 900px;
        margin: 2rem auto;
        padding: 0 1rem;
        font-family: "Cairo", sans-serif;
      }
      .adm-title {
        color: #fff;
        margin-bottom: 1.5rem;
      }
      .adm-row {
        background: var(--bg-card, #1e2230);
        border: 1px solid var(--border, #2e3448);
        border-radius: 12px;
        padding: 1rem 1.25rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 0.75rem;
      }
      .adm-row h3 {
        color: #fff;
        margin: 0 0 0.25rem;
        font-size: 1.05rem;
      }
      .adm-row span.slug {
        color: var(--text-muted, #94a3b8);
        font-size: 0.85rem;
      }
      .adm-status {
        font-size: 0.85rem;
        font-weight: bold;
        padding: 0.3rem 0.7rem;
        border-radius: 6px;
      }
      .adm-status.open {
        background: rgba(34, 197, 94, 0.15);
        color: #22c55e;
      }
      .adm-status.closed {
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
      }
      .adm-toggle-btn {
        border: none;
        border-radius: 8px;
        padding: 0.55rem 1rem;
        font-family: inherit;
        font-weight: bold;
        cursor: pointer;
        color: #fff;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        white-space: nowrap;
      }
      .adm-toggle-btn.to-close {
        background: #ef4444;
      }
      .adm-toggle-btn.to-open {
        background: #22c55e;
      }
      .adm-toggle-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .adm-empty {
        color: var(--text-muted, #94a3b8);
        text-align: center;
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <div class="adm-wrap">
      <h2 class="adm-title">
        <i class="fa-solid fa-toggle-on"></i> التحكم في فتح وغلق الامتحانات
      </h2>
      <div id="examsList">
        <div class="adm-empty">
          <i class="fa-solid fa-spinner fa-spin"></i> جاري التحميل...
        </div>
      </div>
    </div>

    <script type="module" src="../js/admin-exams.js"></script>
  </body>
</html>
