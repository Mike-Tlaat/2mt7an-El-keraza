<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الموضوع الدراسي الأول - منصة الاختبارات والتقييم الذكي</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Tajawal', 'sans-serif'] },
          colors: { brand: { 50: '#f0fdf4', 500: '#10b981', 600: '#059669' } }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Tajawal', sans-serif; }
    .premium-bg {
      background-image: radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.03) 0px, transparent 50%),
        radial-gradient(at 50% 0%, rgba(99, 102, 241, 0.02) 0px, transparent 50%);
    }
    .dark .premium-bg {
      background-image: radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.05) 0px, transparent 50%),
        radial-gradient(at 50% 0%, rgba(15, 23, 42, 0.9) 0px, transparent 50%);
    }
  </style>
</head>

<body
  class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 premium-bg min-h-screen transition-colors duration-300 flex flex-col justify-between">

  <nav
    class="sticky top-0 z-50 backdrop-blur-md bg-white/70 dark:bg-slate-900/70 border-b border-slate-200/80 dark:border-slate-800/80 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white shadow-lg shadow-brand-600/20">
          <i class="fas fa-graduation-cap text-lg"></i>
        </div>
        <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-brand-600 to-emerald-500 bg-clip-text text-transparent">منصة التقييم المتقدمة</span>
      </div>
      <button id="theme-toggle"
        class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-all duration-200 focus:outline-none">
        <i id="theme-toggle-light-icon" class="fas fa-sun hidden text-amber-500"></i>
        <i id="theme-toggle-dark-icon" class="fas fa-moon hidden text-indigo-400"></i>
      </button>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full space-y-20">
    <header class="text-center max-w-2xl mx-auto mb-6">
      <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight leading-tight">
        نظام الامتحانات والمحفوظات الدينية
      </h1>
      <p class="mt-4 text-base sm:text-lg text-slate-500 dark:text-slate-400 font-medium">
        الموضوع الدراسي الأول فقط.
      </p>
    </header>

    <div id="sectionsRoot" class="space-y-20">
      <div class="text-center text-slate-400 py-20"><i class="fas fa-circle-notch fa-spin text-2xl"></i> جارِ تحميل الاختبارات...</div>
    </div>
  </main>

  <footer class="border-t border-slate-200/60 dark:border-slate-900 bg-white dark:bg-slate-950 py-6 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-400 dark:text-slate-500 font-medium">
      &copy; 2026 جميع الحقوق محفوظة لمنصة الاختبارات الذكية.
    </div>
  </footer>

  <div id="toast"
    class="fixed bottom-6 left-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 ease-out pointer-events-none">
    <div class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 shadow-xl rounded-xl px-5 py-3 flex items-center gap-3 font-semibold text-sm">
      <i class="fas fa-check-circle text-brand-500"></i>
      <span>تم نسخ رابط الامتحان بنجاح إلى الحافظة!</span>
    </div>
  </div>

  <script src="js/supabase-client.js"></script>
  <script>
    // هنا قسم واحد فقط: "الموضوع الدراسي الأول" (كان اسمه "الجزء الأول: الدرس الأساسي")
    const SECTION = {
      title: 'الموضوع الدراسي الأول',
      desc: 'الاختبارات المتعلقة بالدروس والأساسيات المعرفية الحالية.',
      icon: 'fas fa-book-reader',
      bg_icon: 'bg-emerald-50 dark:bg-emerald-700/10 text-emerald-600 dark:text-emerald-500',
      hover_text: 'group-hover:text-emerald-600 dark:group-hover:text-emerald-500',
      items: []
    };

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    function isBasicLesson(exam) {
      const name = exam.name || '';
      const category = exam.category || '';
      return name.includes('الدرس الأساسي') || category === 'lesson';
    }

    function renderSection(section) {
      const root = document.getElementById('sectionsRoot');

      const itemsHtml = section.items.length === 0
        ? `<div class="col-span-full text-center py-12 bg-white/40 dark:bg-slate-900/40 rounded-3xl border border-dashed border-slate-200 dark:border-slate-800">
             <i class="fas fa-inbox text-2xl text-slate-300 dark:text-slate-700 mb-2"></i>
             <p class="text-sm text-slate-400 dark:text-slate-500">لا توجد اختبارات متوفرة في هذا الجزء حالياً.</p>
           </div>`
        : section.items.map(exam => `
          <div class="group bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/60 dark:border-slate-800/60 p-6 flex flex-col justify-between transition-all duration-300 hover:-translate-y-1.5 hover:shadow-xl hover:shadow-slate-200/40 dark:hover:shadow-none hover:border-brand-500/30 dark:hover:border-brand-500/30 relative overflow-hidden">
            <div>
              <div class="flex items-center justify-between mb-5">
                <div class="w-11 h-11 rounded-xl flex items-center justify-center text-base ${section.bg_icon} group-hover:scale-110 transition-transform duration-300">
                  <i class="far fa-file-alt"></i>
                </div>
                <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400">متاح الآن</span>
              </div>
              <div class="space-y-2">
                <h3 class="text-lg font-bold text-slate-900 dark:text-white ${section.hover_text} transition-colors duration-200 leading-snug">${escapeHtml(exam.name)}</h3>
                <p class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed">تقييم إلكتروني شامل مصمم لقياس الحفظ، الاستيعاب، والمفاهيم الأساسية بدقة.</p>
              </div>
            </div>
            <div class="mt-8 pt-4 border-t border-slate-100 dark:border-slate-800/80 flex flex-col gap-4">
              <a href="exam.html?exam=${encodeURIComponent(exam.slug)}"
                class="w-full inline-flex items-center justify-center gap-2 bg-slate-900 hover:bg-brand-600 dark:bg-slate-800 dark:hover:bg-brand-600 text-white font-semibold py-3 px-4 rounded-xl transition-all duration-200 active:scale-[0.98]">
                <span>ابدأ التقييم المباشر</span>
                <i class="fas fa-arrow-left text-xs transition-transform group-hover:-translate-x-1"></i>
              </a>
              <div class="flex items-center justify-between text-xs text-slate-400 dark:text-slate-500 px-1">
                <span class="flex items-center gap-1"><i class="fas fa-share-alt"></i> مشاركة سريعة</span>
                <button onclick="copyToClipboard('${window.location.origin}${window.location.pathname.replace('index1.html','')}exam.html?exam=${exam.slug}')"
                  class="inline-flex items-center gap-1.5 font-bold text-brand-600 dark:text-brand-500 hover:text-brand-700 dark:hover:text-brand-400 transition-colors bg-brand-500/5 dark:bg-brand-500/10 py-1.5 px-2.5 rounded-lg">
                  <i class="far fa-copy"></i><span>نسخ الرابط</span>
                </button>
              </div>
            </div>
          </div>`).join('');

      root.innerHTML = `
        <section class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-200/80 dark:border-slate-800/80 pb-5">
            <div class="flex items-start gap-4">
              <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-lg shrink-0 ${section.bg_icon} shadow-sm border border-slate-100 dark:border-slate-800/50">
                <i class="${section.icon}"></i>
              </div>
              <div class="space-y-1">
                <h2 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">${section.title}</h2>
                <p class="text-sm text-slate-400 dark:text-slate-500 font-medium">${section.desc}</p>
              </div>
            </div>
            <span class="self-start sm:self-center text-xs font-bold px-3 py-1.5 rounded-full bg-slate-100 dark:bg-slate-800/60 text-slate-500 dark:text-slate-400 whitespace-nowrap">${section.items.length} اختبار متاح</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">${itemsHtml}</div>
        </section>`;
    }

    async function loadExams() {
      const { data, error } = await supabaseClient.from('exams').select('*').order('id');

      if (error) {
        document.getElementById('sectionsRoot').innerHTML =
          `<div class="text-center text-red-500 py-20">حدث خطأ في تحميل الاختبارات: ${escapeHtml(error.message)}</div>`;
        return;
      }

      SECTION.items = (data || []).filter(isBasicLesson);
      renderSection(SECTION);
    }

    loadExams();

    const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
    const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');
    if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
      themeToggleLightIcon.classList.remove('hidden');
    } else {
      document.documentElement.classList.remove('dark');
      themeToggleDarkIcon.classList.remove('hidden');
    }
    document.getElementById('theme-toggle').addEventListener('click', function () {
      themeToggleDarkIcon.classList.toggle('hidden');
      themeToggleLightIcon.classList.toggle('hidden');
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('color-theme', 'light');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('color-theme', 'dark');
      }
    });

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.remove('translate-y-20', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
        setTimeout(() => {
          toast.classList.remove('translate-y-0', 'opacity-100');
          toast.classList.add('translate-y-20', 'opacity-0');
        }, 3000);
      }).catch(err => console.error('فشل في نسخ الرابط: ', err));
    }
  </script>
</body>
</html>
